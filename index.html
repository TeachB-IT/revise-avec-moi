      question: `Cosa significa “${card.french}”?`, answers: rotated, correctAnswer: card.italian,

function renderQuiz(){if(!quizDeck.length)return;if(quizIndex>=quizDeck.length){const correct=quizDeck.filter(q=>q._ok).length;const pct=Math.round(correct/quizDeck.length*100);document.querySelector('#quizArea').innerHTML=`<div class="card quizbox"><div class="bigstat">${pct}% 🎉</div><h3>${correct}/${quizDeck.length} risposte corrette</h3><p>${pct>=80?'Très bien! Ottimo ripasso.':pct>=60?'Bien! Ripassa gli errori e riprova.':'Continua: ogni errore ti dice cosa ripassare.'}</p><button class="btn" id="quizAgain">Altre 5 domande</button></div>`;document.querySelector('#quizAgain').onclick=()=>{quizDeck=shuffle(quizQuestions).slice(0,5);quizIndex=0;renderQuiz()};return}const q=quizDeck[quizIndex];quizAnswered=false;document.querySelector('#quizArea').innerHTML=`<div class="card quizbox"><div class="counter">Domanda ${quizIndex+1} / ${quizDeck.length}</div><div class="question">${esc(q.question)}</div><div class="answers">${q.answers.map(a=>`<button class="answer" data-answer="${esc(a)}">${esc(a)}</button>`).join('')}</div><div id="quizFeedback"></div></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerQuiz(q,b))}
function answerQuiz(q,b){if(quizAnswered)return;quizAnswered=true;const ok=b.dataset.answer===q.correctAnswer;q._ok=ok;S.quizTotal=(S.quizTotal||0)+1;if(ok){S.quizCorrect=(S.quizCorrect||0)+1;award(8,'Quiz: risposta corretta')}else{S.lives=Math.max(0,(S.lives??5)-1);save()}document.querySelectorAll('[data-answer]').forEach(x=>{if(x.dataset.answer===q.correctAnswer)x.classList.add('correct');else if(x===b)x.classList.add('wrong')});document.querySelector('#quizFeedback').innerHTML=`<div class="feedback"><b>${ok?'✅ Très bien!':'❌ Presque!'}</b><br>${esc(q.explanation)}</div><button class="btn" id="nextQuiz" style="margin-top:10px">Continua →</button>`;document.querySelector('#nextQuiz').onclick=()=>{quizIndex++;renderQuiz()}}
function giochi(){const games=[['memory','🧩','Memory','Abbina francese e italiano.'],['verb','⚡','Verb Challenge','Scegli la coniugazione corretta.'],['phrase','🧱','Phrase Builder','Riordina le parole.'],['speed','⏱️','Speed Match','Rispondi velocemente al lessico.'],['article','🎯','Scegli l’articolo','Le, la, un, une?'],['pc','⏮️','Passé composé','Avoir o être?'],['daily','🌅','La journée','Rimetti in ordine la routine.'],['restaurant','🍽️','Le Restaurant','Completa un mini-dialogo.'],['directions','🗺️','Où est-ce?','Ripassa le indicazioni stradali.']];return `<div class="section-title"><div><div class="kicker">Jeux 🎮</div><h2>Impara giocando</h2></div><p>9 attività interattive</p></div><div class="game-grid">${games.map(g=>`<article class="card clickable" data-game="${g[0]}"><div class="icon">${g[1]}</div><h3>${g[2]}</h3><p>${g[3]}</p></article>`).join('')}</div><div id="gameArea"></div>`}
function startGame(id){if(id==='memory')return memoryGame();if(id==='verb')return verbGame();if(id==='phrase')return phraseGame();if(id==='speed')return speedGame();if(id==='article')return articleGame();if(id==='pc')return pcGame();if(id==='daily')return dailyGame();if(id==='restaurant')return restaurantGame();return directionsGame()}
function memoryGame(){const cs=shuffle(flashcards).slice(0,6);let pool=shuffle(cs.flatMap(c=>[{k:c.id,t:c.french},{k:c.id,t:c.italian}]));document.querySelector('#gameArea').innerHTML=`<div class="card gamebox"><h3>Memory</h3><p>Abbina le 6 coppie.</p><div class="memory">${pool.map((x,i)=>`<button class="mem" data-i="${i}" data-k="${x.k}">${esc(x.t)}</button>`).join('')}</div><div id="gameMsg"></div></div>`;let chosen=[];document.querySelectorAll('.mem').forEach(b=>b.onclick=()=>{if(b.classList.contains('done')||chosen.includes(b))return;chosen.push(b);b.style.background='#edf3ff';if(chosen.length===2){if(chosen[0].dataset.k===chosen[1].dataset.k){chosen.forEach(x=>x.classList.add('done'));chosen=[];award(3,'Memory: coppia corretta');if([...document.querySelectorAll('.mem')].every(x=>x.classList.contains('done')))document.querySelector('#gameMsg').innerHTML='<div class="feedback">🎉 Memory completato!</div>'}else setTimeout(()=>{chosen.forEach(x=>x.style.background='');chosen=[]},500)}})}
function verbGame(){const v=shuffle(verbs).find(x=>x.present?.length===6),i=Math.floor(Math.random()*6),p=['Je','Tu','Il/Elle','Nous','Vous','Ils/Elles'][i],opts=shuffle([v.present[i],...verbs.filter(x=>x!==v).slice(0,3).map(x=>x.present[i])]);gameQuestion(`Verb Challenge: ${p} + ${v.infinitive}`,opts,v.present[i],`${p} ${v.present[i]} est la bonne forme.`,'Verb Challenge')}
function phraseGame(){const phrases=[['Je vais à l’école.',['vais','je','école','à','l’']],['Nous faisons du sport.',['sport','faisons','nous','du']],['Elle a les cheveux noirs.',['cheveux','a','elle','noirs','les']]];const p=shuffle(phrases)[0];document.querySelector('#gameArea').innerHTML=`<div class="card gamebox"><h3>Phrase Builder</h3><p>Clicca le parole nell'ordine giusto.</p><div class="tokens">${shuffle(p[1]).map(w=>`<button class="token">${esc(w)}</button>`).join('')}</div><h3 id="built" style="min-height:35px"></h3><button class="btn" id="checkPhrase">Controlla</button><div id="gameMsg"></div></div>`;let arr=[];document.querySelectorAll('.token').forEach(b=>b.onclick=()=>{arr.push(b.textContent);b.disabled=true;document.querySelector('#built').textContent=arr.join(' ')});document.querySelector('#checkPhrase').onclick=()=>{const norm=x=>x.toLowerCase().replace(/[’']/g,'').replace(/[.]/g,'').replace(/\s+/g,'');const ok=norm(arr.join(' '))===norm(p[0]);document.querySelector('#gameMsg').innerHTML=`<div class="feedback">${ok?'✅ Très bien!':'❌ La frase corretta è: '+esc(p[0])}</div>`;if(ok)award(8,'Phrase Builder')}}
function speedGame(){const c=shuffle(flashcards)[0],opts=shuffle([c.italian,...shuffle(flashcards.filter(x=>x.id!==c.id)).slice(0,3).map(x=>x.italian)]);gameQuestion(`Speed Match: “${c.french}” significa…`,opts,c.italian,`“${c.french}” = “${c.italian}”.`,'Speed Match')}
function articleGame(){const q=grammarQuizQuestions.find(x=>x.topic==='articoli')||grammarQuizQuestions[0];gameQuestion(q.question,q.answers,q.correctAnswer,q.explanation,'Scegli l’articolo')}
function pcGame(){const q=grammarQuizQuestions.find(x=>x.topic==='passe-compose');gameQuestion(q.question,q.answers,q.correctAnswer,q.explanation,'Passé composé')}
function dailyGame(){const correct=['se réveiller','se lever','se laver','s’habiller','aller à l’école','faire ses devoirs','dîner','se coucher'];let shuffled=shuffle(correct);document.querySelector('#gameArea').innerHTML=`<div class="card gamebox"><h3>La journée</h3><p>Metti in ordine: usa i pulsanti ↑.</p><div id="dailyList">${shuffled.map((x,i)=>`<div class="row"><span class="grow">${esc(x)}</span><button class="btn soft up" data-i="${i}">↑</button></div>`).join('')}</div><button class="btn" id="checkDaily" style="margin-top:10px">Controlla</button><div id="gameMsg"></div></div>`;function redraw(){document.querySelector('#dailyList').innerHTML=shuffled.map((x,i)=>`<div class="row"><span class="grow">${esc(x)}</span><button class="btn soft up" data-i="${i}">↑</button></div>`).join('');document.querySelectorAll('.up').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(i>0){[shuffled[i-1],shuffled[i]]=[shuffled[i],shuffled[i-1]];redraw()}})}redraw();document.querySelector('#checkDaily').onclick=()=>{const ok=shuffled.join('|')===correct.join('|');document.querySelector('#gameMsg').innerHTML=`<div class="feedback">${ok?'✅ Ordine perfetto!':'🤔 Non ancora. La giornata inizia con se réveiller → se lever.'}</div>`;if(ok)award(10,'La journée')}}
function restaurantGame(){gameQuestion('Serveur: Bonjour! Qu’est-ce que vous désirez?',['Je voudrais un croissant, s’il vous plaît.','Je suis un croissant.','Où est le train?'],'Je voudrais un croissant, s’il vous plaît.','Per ordinare cortesemente: Je voudrais…','Le Restaurant')}
function directionsGame(){gameQuestion('Pour aller à la gare, continuez…',['tout droit','très fromage','avoir droite'],'tout droit','“Tout droit” significa “sempre dritto”.','Où est-ce?')}
function gameQuestion(title,opts,correct,expl,label){document.querySelector('#gameArea').innerHTML=`<div class="card gamebox"><h3>${esc(title)}</h3><div class="answers">${opts.map(x=>`<button class="answer game-answer" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div><div id="gameMsg"></div></div>`;document.querySelectorAll('.game-answer').forEach(b=>b.onclick=()=>{const ok=b.dataset.v===correct;b.classList.add(ok?'correct':'wrong');document.querySelector('#gameMsg').innerHTML=`<div class="feedback">${ok?'✅ Très bien!':'❌ Presque!'} ${esc(expl)}</div>`;if(ok)award(8,label)})}
function comunicazione(){return `<div class="section-title"><div><div class="kicker">Je communique 🗣️</div><h2>Parla in situazioni reali</h2></div><p>${communicationScenarios.length} scenari</p></div><div class="grid">${communicationScenarios.map((s,i)=>`<article class="card"><div class="icon">${['🥐','🍽️','👕','🚉','🏨','🏫','🏥','📱','🎂','🗼'][i]||'🗣️'}</div><h3>${esc(s.title||s.name||'Dialogue')}</h3><p>${esc(s.setting||s.prompt||'Mini-dialogo guidato')}</p>${scenarioLines(s)}</article>`).join('')}</div>`}
function scenarioLines(s){const str=JSON.stringify(s);const fr=[...str.matchAll(/"([^"\\]{8,}[?!\.])"/g)].slice(0,2).map(m=>m[1]);return fr.length?`<button class="btn soft scenario" data-dialogue="${esc(fr[0])}" style="margin-top:12px">🔊 Ascolta una battuta</button>`:''}
function comprensione(){return `<div class="section-title"><div><div class="kicker">Compréhension 👂 📖</div><h2>Ascolta e leggi</h2></div><p>${comprehensionActivities.length} attività</p></div><div class="list">${comprehensionActivities.map((x,i)=>`<article class="card"><div class="kicker">Attività ${i+1}</div><h3>${esc(x.title||'Compréhension')}</h3><p>${esc(x.text||x.content||x.audioText||'Testo breve A1')}</p>${x.audioText||x.text?`<button class="btn soft" data-speak="${esc(x.audioText||x.text)}">🔊 Écoute</button>`:''}</article>`).join('')}</div>`}
function cultura(){return `<div class="section-title"><div><div class="kicker">Découvre la France 🌍</div><h2>Cultura e Francofonia</h2></div><p>${cultureTopics.length} schede</p></div><div class="grid">${cultureTopics.map(x=>`<article class="card"><div class="icon">🌍</div><h3>${esc(x.title)}</h3><p>${esc(x.summary||x.text||x.content||'Scopri un aspetto della cultura francofona.')}</p></article>`).join('')}</div>`}
function progressi(){const learned=Object.values(S.flash||{}).filter(x=>x.score>=2).length,acc=S.quizTotal?Math.round(S.quizCorrect/S.quizTotal*100):0;return `<div class="section-title"><div><div class="kicker">Mes progrès 📊</div><h2>Il tuo allenamento</h2></div><button class="btn soft" id="resetProgress">Azzera progressi</button></div><section class="statgrid"><div class="card"><div class="bigstat">${S.xp||0}</div><p>XP totali</p></div><div class="card"><div class="bigstat">${S.streak||1}</div><p>giorni di streak</p></div><div class="card"><div class="bigstat">${learned}</div><p>flashcard imparate</p></div><div class="card"><div class="bigstat">${acc}%</div><p>precisione quiz</p></div></section><div class="section-title"><h2>Padronanza</h2></div><div class="list">${grammarTopics.map(t=>{const p=S.completed?.[t.slug]?100:S.mastery?.[t.slug]||0;return `<div class="row"><div class="grow"><b>${esc(t.title)}</b><div class="progress" style="margin-top:7px"><i style="width:${p}%"></i></div></div><b>${p}%</b></div>`}).join('')}</div><div class="section-title"><h2>Ultime attività</h2></div><div class="list">${(S.activities||[]).slice(0,8).map(a=>`<div class="row"><span class="grow">${esc(a.label)}</span><span class="muted">${esc(a.at)}</span></div>`).join('')||'<div class="card empty">Nessuna attività ancora.</div>'}</div>`}
function programma(){return `<div class="section-title"><div><div class="kicker">Tout le programme ✅</div><h2>Checklist completa</h2></div><p>Consulta tutto, senza blocchi</p></div><div class="list">${grammarTopics.map(t=>`<div class="row"><span>${S.completed?.[t.slug]?'✓':S.mastery?.[t.slug]?'◐':'☐'}</span><div class="grow"><b>${esc(t.title)}</b><div class="muted">Grammatica · ${t.level}</div></div><button class="btn soft" data-grammar="${t.slug}">Apri</button></div>`).join('')}${[...new Set(flashcards.map(x=>x.category))].map(c=>`<div class="row"><span>☐</span><div class="grow"><b>${esc(categoryLabels[c]||c)}</b><div class="muted">Lessico · ${flashcards.filter(x=>x.category===c).length} carte</div></div><button class="btn soft" data-vocab="${c}">Apri</button></div>`).join('')}</div>`}
function impostazioni(){return `<div class="section-title"><div><div class="kicker">Impostazioni ⚙️</div><h2>Personalizza l'app</h2></div></div><div class="layout2"><div class="card"><h3>Classe</h3><select id="classSet"><option value="2" ${S.class==='2'?'selected':''}>2ª media</option><option value="3" ${S.class==='3'?'selected':''}>3ª media</option><option value="all" ${S.class==='all'?'selected':''}>Ripasso completo</option></select><h3>Accessibilità</h3><label class="row"><input type="checkbox" id="reduce" ${S.reduceMotion?'checked':''}> Riduci animazioni</label><label class="row"><input type="checkbox" id="highread" ${S.highRead?'checked':''}> Alta leggibilità</label></div><div class="card"><h3>Audio</h3><p>La pronuncia usa la sintesi vocale del browser in francese <b>fr-FR</b>.</p><div class="toolbar"><button class="btn soft" data-speak="Bonjour ! Comment ça va ?">🔊 Velocità normale</button><button class="btn soft" id="slowTest">🐢 Velocità lenta</button></div><p class="muted">I dati restano sul dispositivo tramite localStorage quando il browser lo consente.</p></div></div>`}
function empty(){return '<div class="card empty">Contenuto non trovato.</div>'}
function levelName(){const x=S.xp||0;return x>=500?'Petit Français':x>=250?'Explorateur':x>=100?'Apprenti':'Débutant'}
function render(){activeNav();const [r,arg]=route();if(r==='home')app.innerHTML=home();else if(r==='percorso')app.innerHTML=percorso();else if(r==='grammatica')app.innerHTML=grammatica(arg);else if(r==='lessico')app.innerHTML=lessico(arg);else if(r==='flashcards')app.innerHTML=flashcardsPage();else if(r==='verbi')app.innerHTML=verbi(arg);else if(r==='quiz')app.innerHTML=quizPage();else if(r==='giochi')app.innerHTML=giochi();else if(r==='comunicazione')app.innerHTML=comunicazione();else if(r==='comprensione')app.innerHTML=comprensione();else if(r==='cultura')app.innerHTML=cultura();else if(r==='progressi')app.innerHTML=progressi();else if(r==='programma')app.innerHTML=programma();else if(r==='impostazioni')app.innerHTML=impostazioni();else app.innerHTML=home();wire();app.focus({preventScroll:true})}
function wireSpeak(){document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.speak)})}
function wire(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>setRoute(x.dataset.go));document.querySelectorAll('[data-grammar]').forEach(x=>x.onclick=()=>location.hash='#/grammatica/'+x.dataset.grammar);document.querySelectorAll('[data-vocab]').forEach(x=>x.onclick=()=>location.hash='#/lessico/'+x.dataset.vocab);document.querySelectorAll('[data-verb]').forEach(x=>x.onclick=()=>location.hash='#/verbi/'+x.dataset.verb);wireSpeak();document.querySelectorAll('.scenario').forEach(x=>x.onclick=()=>speak(x.dataset.dialogue));
 if(document.querySelector('#quick'))document.querySelector('#quick').onclick=()=>{setRoute('quiz');setTimeout(()=>{document.querySelector('#quizSize').value='10';document.querySelector('#startQuiz').click()},30)};
 if(document.querySelector('#catSelect'))document.querySelector('#catSelect').onchange=e=>location.hash='#/lessico/'+e.target.value;
 if(document.querySelector('#wordFilter'))document.querySelector('#wordFilter').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('[data-searchword]').forEach(x=>x.classList.toggle('hidden',!x.dataset.searchword.includes(q)))};
 if(document.querySelector('#startFlash'))document.querySelector('#startFlash').onclick=()=>{let pool=flashcards,cat=document.querySelector('#flashCat').value,n=+document.querySelector('#flashSize').value;if(cat!=='tutto')pool=pool.filter(x=>x.category===cat);const hard=pool.filter(x=>S.difficult?.[x.id]);currentFlashDeck=shuffle([...hard,...pool]).slice(0,n);flashIndex=0;renderFlash()};
 if(document.querySelector('#hardFlash'))document.querySelector('#hardFlash').onclick=()=>{currentFlashDeck=shuffle(flashcards.filter(x=>S.difficult?.[x.id])).slice(0,20);if(!currentFlashDeck.length)return alert('Non hai ancora carte difficili.');flashIndex=0;renderFlash()};
 if(document.querySelector('#startQuiz'))document.querySelector('#startQuiz').onclick=()=>{const typ=document.querySelector('#quizType').value,n=+document.querySelector('#quizSize').value;let pool=typ==='all'?quizQuestions:quizQuestions.filter(x=>x.category===typ);quizDeck=shuffle(pool).slice(0,n).map(x=>({...x}));quizIndex=0;renderQuiz()};
 document.querySelectorAll('.mini-answer').forEach(b=>b.onclick=()=>{const ok=b.dataset.correct==='true';document.querySelector('#miniFeedback').innerHTML=`<div class="feedback">${ok?'✅ Très bien!':'❌ Presque!'} ${b.dataset.expl}</div>`;if(ok)award(5,'Mini quiz grammatica')});
 if(document.querySelector('#understood'))document.querySelector('#understood').onclick=()=>{const slug=route()[1];S.completed[slug]=true;S.mastery[slug]=100;award(10,'Lezione completata: '+slug);render()};if(document.querySelector('#repeat'))document.querySelector('#repeat').onclick=()=>{const slug=route()[1];S.mastery[slug]=Math.max(20,S.mastery[slug]||0);save();alert('Segnato tra gli argomenti da ripassare.');};
 document.querySelectorAll('[data-game]').forEach(x=>x.onclick=()=>startGame(x.dataset.game));
 if(document.querySelector('#resetProgress'))document.querySelector('#resetProgress').onclick=()=>{if(confirm('Vuoi davvero azzerare tutti i progressi?')){S={...defaultState,class:S.class};save();render()}};
 if(document.querySelector('#classSet'))document.querySelector('#classSet').onchange=e=>{S.class=e.target.value;save()};if(document.querySelector('#reduce'))document.querySelector('#reduce').onchange=e=>{S.reduceMotion=e.target.checked;save()};if(document.querySelector('#highread'))document.querySelector('#highread').onchange=e=>{S.highRead=e.target.checked;save()};if(document.querySelector('#slowTest'))document.querySelector('#slowTest').onclick=()=>speak('Bonjour ! Comment ça va ?',true)
}
function globalSearch(q){q=q.trim().toLowerCase();if(q.length<2)return[];const res=[];grammarTopics.filter(x=>(x.title+' '+x.summary+' '+x.slug).toLowerCase().includes(q)).slice(0,5).forEach(x=>res.push({type:'Grammatica',title:x.title,route:'grammatica/'+x.slug}));flashcards.filter(x=>(x.french+' '+x.italian+' '+x.category).toLowerCase().includes(q)).slice(0,7).forEach(x=>res.push({type:'Lessico',title:x.french+' — '+x.italian,route:'lessico/'+x.category}));verbs.filter(x=>(x.infinitive+' '+x.italian).toLowerCase().includes(q)).slice(0,4).forEach(x=>res.push({type:'Verbo',title:x.infinitive+' — '+x.italian,route:'verbi/'+encodeURIComponent(x.infinitive)}));return res.slice(0,12)}
const gs=document.querySelector('#globalSearch'),sr=document.querySelector('#searchResults');gs.oninput=()=>{const r=globalSearch(gs.value);sr.innerHTML=r.map((x,i)=>`<div class="search-result" data-searchroute="${x.route}"><b>${esc(x.title)}</b><br><small>${x.type}</small></div>`).join('');sr.classList.toggle('hidden',!r.length);document.querySelectorAll('[data-searchroute]').forEach(x=>x.onclick=()=>{location.hash='#/'+x.dataset.searchroute;sr.classList.add('hidden');gs.value=''})};document.addEventListener('click',e=>{if(!e.target.closest('.search'))sr.classList.add('hidden')});
window.addEventListener('hashchange',render);renderNav();updateTop();applyPrefs();if(!S.class)document.querySelector('#onboarding').classList.remove('hidden');document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{S.class=b.dataset.class;touch();document.querySelector('#onboarding').classList.add('hidden');render()});render();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
